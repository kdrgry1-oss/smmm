name: malimusavir_mobile
description: >-
  Mali Müşavir SaaS mobil uygulaması — SMMM'nin sahada fiş çekmesi,
  mükellef takibi ve e-Tebligat izlemesi (iOS + Android + Huawei tek kod tabanı).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP istemcisi (Bearer, multipart yükleme + ilerleme)
  http: ^1.2.0
  # Kamera / galeri (iOS + Android + Huawei'de HMS'siz çalışır)
  image_picker: ^1.1.0
  # JWT ve API adresi güvenli saklama (Keychain / Keystore)
  flutter_secure_storage: ^9.2.0
  # tr_TR tarih/para biçimlendirme — flutter_localizations'ın kilitlediği sürüme uyar
  intl: any
  # Durum yönetimi
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
