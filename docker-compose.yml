services:
  postgres:
    image: postgres:16
    container_name: malimusavir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: malimusavir
    ports:
      - "5432:5432"
    volumes:
      - malimusavir-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d malimusavir"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  malimusavir-pgdata:
